<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 - CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/facade.css">
<style>
  /* 門面「天藍海報」— 登入：drenched sky 場地上一張白紙 sheet */
  body { min-height: 100vh; min-height: 100dvh; }
  .staff-kick {
    font-family: "Archivo","Noto Sans TC",sans-serif; font-weight: 800;
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: #fff; margin-bottom: 14px;
  }
  .login-card {
    background: #fff; color: var(--ink);
    border: 0; border-radius: 0;
    padding: 30px 26px 26px;
    max-width: 400px; width: 100%;
    animation: card-enter 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes card-enter {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  .login-logo {
    width: 68px; height: 68px;
    margin: 0 auto 12px;
    display: block;
    object-fit: contain;
  }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 18px;
    border: 1px solid var(--line); border-radius: 0;
    background: #fff; color: #1f2937; font-weight: 600; font-size: 14px;
    transition: background 150ms, border-color 150ms; cursor: pointer;
    text-decoration: none;
  }
  .btn-google:hover { background: #f9fafb; border-color: var(--ink-mute); }
  .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--ink-mute); font-size: 12px; margin: 18px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  @media (prefers-reduced-motion: reduce) { .login-card { animation: none; } }
</style>
</head>
<body class="flex flex-col items-center justify-center p-6">

<div class="staff-kick">Staff Access</div>
<div class="login-card">
  <div class="text-center mb-6">
    <img src="/logo.png" alt="CHINUP Performance" class="login-logo">
    <h1 class="text-2xl font-bold" style="letter-spacing:-0.02em;">管理員 / 教練專用登入</h1>
    <p class="subtle mt-1">CHINUP Performance 後台入口，限授權人員使用</p>
  </div>

  <!-- Google OAuth -->
  <a href="/api/auth/google" class="btn-google">
    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    使用 Google 登入
  </a>

  <div class="divider">或</div>

  <!-- Login form -->
  <form id="login-form" class="space-y-4">
    <div>
      <label class="form-label" for="email">電子郵件</label>
      <input id="email" name="email" type="email" required class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div>
      <label class="form-label" for="password">密碼</label>
      <input id="password" name="password" type="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-err" class="text-sm" style="color:#dc2626;display:none;"></div>
    <button type="submit" class="btn btn-primary w-full" id="login-btn">登入</button>
  </form>

  <button type="button" class="btn btn-ghost w-full" id="show-changepw" style="margin-top:10px;">修改密碼</button>

  <!-- Change password form (hidden by default) -->
  <form id="changepw-form" class="space-y-4" style="display:none;">
    <p class="subtle text-sm">輸入帳號與目前密碼以設定新密碼（限教練 / 管理者帳號）。</p>
    <div>
      <label class="form-label" for="cp-email">電子郵件</label>
      <input id="cp-email" type="email" required class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div>
      <label class="form-label" for="cp-current">目前密碼</label>
      <input id="cp-current" type="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div>
      <label class="form-label" for="cp-new">新密碼（至少 6 碼）</label>
      <input id="cp-new" type="password" required minlength="6" class="form-input" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div>
      <label class="form-label" for="cp-new2">確認新密碼</label>
      <input id="cp-new2" type="password" required class="form-input" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div id="cp-msg" class="text-sm" style="display:none;"></div>
    <button type="submit" class="btn btn-primary w-full" id="cp-btn">更新密碼</button>
    <button type="button" class="btn btn-ghost w-full" id="cp-back">返回登入</button>
  </form>

</div>

<script type="module">
const $ = s => document.querySelector(s);

const loginForm = $('#login-form');

// Already logged in? bounce based on role
if (localStorage.getItem('chinup.token')) {
  fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${localStorage.getItem('chinup.token')}` }})
    .then(r => r.ok ? r.json() : null)
    .then(u => { if (u) location.href = u.is_admin ? '/admin.html' : u.role === 'coach' ? '/coach.html' : '/'; });
}

// Display OAuth error on URL (?err=xxx)
const err = new URLSearchParams(location.search).get('err');
if (err) {
  $('#login-err').textContent = `登入失敗：${err}`;
  $('#login-err').style.display = 'block';
}

// --- Login form ---
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const submit = $('#login-btn');
  const errEl = $('#login-err');
  errEl.style.display = 'none';
  submit.disabled = true; submit.textContent = '登入中…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error === 'invalid_credentials' ? '帳號或密碼錯誤' : (data.error || 'login failed'));
    localStorage.setItem('chinup.token', data.token);
    localStorage.setItem('chinup.user', JSON.stringify(data.user));
    const redirect = new URLSearchParams(location.search).get('redirect') || (data.user.is_admin ? '/admin.html' : data.user.role === 'coach' ? '/coach.html' : '/');
    location.href = redirect;
  } catch (e2) {
    errEl.textContent = e2.message;
    errEl.style.display = 'block';
    submit.disabled = false; submit.textContent = '登入';
  }
});

// --- Change password ---
const cpForm = $('#changepw-form');
const loginEls = [$('.btn-google'), $('.divider'), loginForm, $('#show-changepw')];
const showLogin = (showCp) => {
  loginEls.forEach(el => { if (el) el.style.display = showCp ? 'none' : ''; });
  cpForm.style.display = showCp ? '' : 'none';
};
$('#show-changepw').addEventListener('click', () => {
  if ($('#email').value.trim()) $('#cp-email').value = $('#email').value.trim();
  showLogin(true);
});
$('#cp-back').addEventListener('click', () => { $('#cp-msg').style.display = 'none'; showLogin(false); });

cpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#cp-email').value.trim();
  const currentPassword = $('#cp-current').value;
  const newPassword = $('#cp-new').value;
  const msgEl = $('#cp-msg');
  const btn = $('#cp-btn');
  const show = (text, ok) => { msgEl.textContent = text; msgEl.style.color = ok ? '#16a34a' : '#dc2626'; msgEl.style.display = 'block'; };
  msgEl.style.display = 'none';
  if (newPassword.length < 6) return show('新密碼至少 6 碼', false);
  if (newPassword !== $('#cp-new2').value) return show('兩次新密碼不一致', false);
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, currentPassword, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      const m = { invalid_credentials: '帳號或目前密碼錯誤', weak_password: '新密碼至少 6 碼', user_login_disabled: '此帳號不可修改密碼', missing_fields: '請填寫所有欄位' };
      throw new Error(m[data.error] || data.error || '修改失敗');
    }
    show('密碼已更新，請用新密碼登入', true);
    cpForm.reset();
    setTimeout(() => { $('#cp-msg').style.display = 'none'; showLogin(false); }, 1800);
  } catch (e2) {
    show(e2.message, false);
  } finally {
    btn.disabled = false; btn.textContent = '更新密碼';
  }
});
</script>
</body>
</html>
