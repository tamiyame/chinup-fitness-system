<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 - CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>
  /* ── Nike technical aesthetic overlay (loaded after style.css → wins on equal specificity) ── */
  body {
    background: var(--canvas);
    min-height: 100vh;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 26px 28px;
    box-shadow: none;
    max-width: 430px; width: 100%;
    animation: card-enter 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes card-enter {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Uppercase kicker + trailing hairline */
  .login-kicker {
    display: flex; align-items: center; gap: 12px;
    font-family: "Archivo", sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 18px;
  }
  .login-kicker::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* Archivo display heading */
  .login-card h1 {
    font-family: "Archivo", "Noto Sans TC", sans-serif;
    font-weight: 900; font-size: 40px; line-height: .96; letter-spacing: -.03em;
    color: var(--ink);
  }
  .login-lede {
    margin-top: 12px;
    font-size: 14px; font-weight: 400; line-height: 1.55;
    color: var(--ink-soft);
  }

  /* Form fields — thin border, sky focus ring */
  .login-card .form-label {
    display: block;
    font-family: "Archivo", sans-serif; font-weight: 700;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .login-card .form-input {
    width: 100%;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 16px; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .login-card .form-input::placeholder { color: var(--ink-mute); }
  .login-card .form-input:focus {
    border-color: var(--brand-600);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, .14);
  }

  /* Solid sky full-width primary button */
  .login-card .btn-primary {
    display: block; width: 100%;
    min-height: 46px;
    background: var(--brand-600);
    color: #fff;
    border: 0; border-radius: 8px;
    font-family: "Archivo", "Noto Sans TC", sans-serif; font-weight: 800;
    font-size: 15px; letter-spacing: .04em;
    cursor: pointer; box-shadow: none;
    transition: background .15s;
  }
  .login-card .btn-primary:hover { background: var(--brand-700); transform: none; }
  .login-card .btn-primary:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; transform: none; }

  /* Ghost "修改密碼 / 返回登入" rendered as a quiet bordered button */
  .login-card .btn-ghost {
    display: block; width: 100%;
    min-height: 44px;
    background: var(--surface);
    color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 8px;
    font-family: "Noto Sans TC", sans-serif; font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .login-card .btn-ghost:hover { background: #fcfdfd; border-color: var(--ink-mute); }

  /* Outline Google button with line-drawn G glyph (no multicolour emoji) */
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 46px; padding: 0 18px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px;
    transition: border-color .15s, background .15s; cursor: pointer;
    text-decoration: none;
  }
  .btn-google:hover { background: #fcfdfd; border-color: var(--ink-mute); }
  .g-glyph {
    font-family: "Archivo", sans-serif; font-weight: 900;
    font-size: 14px; line-height: 1;
    width: 22px; height: 22px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--ink); border-radius: 50%;
    color: var(--ink);
  }

  /* Uppercase divider with hairlines (script toggles .divider display) */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 18px;
    font-family: "Archivo", sans-serif; font-weight: 700;
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* Change-password intro line */
  .login-card #changepw-form .subtle {
    color: var(--ink-soft); font-size: 13px; line-height: 1.55;
  }

  /* Honest-boundary footer note: status dot + muted text (no filled pill) */
  .login-note {
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; color: var(--ink-mute);
    letter-spacing: .02em;
  }
  .login-note .dot { width: 6px; height: 6px; background: var(--ink-mute); flex: none; }

  /* tabular numerals for any inline numbers / codes */
  .login-card { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="flex items-center justify-center p-6">

<div class="login-card">
  <div class="login-kicker">STAFF · 員工登入</div>
  <h1>登入</h1>
  <p class="login-lede">CHINUP Performance 後台入口，限教練與管理者帳號使用。</p>

  <!-- Login form -->
  <form id="login-form" class="space-y-4" style="margin-top:26px;">
    <div>
      <label class="form-label" for="email">電子郵件</label>
      <input id="email" name="email" type="email" required class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div>
      <label class="form-label" for="password">密碼</label>
      <input id="password" name="password" type="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-err" class="text-sm" style="color:#dc2626;display:none;"></div>
    <button type="submit" class="btn btn-primary w-full" id="login-btn">登入</button>
  </form>

  <div class="divider">或</div>

  <!-- Google OAuth (line-drawn G glyph, no multicolour mark) -->
  <a href="/api/auth/google" class="btn-google">
    <span class="g-glyph" aria-hidden="true">G</span>
    使用 Google 登入
  </a>

  <button type="button" class="btn btn-ghost w-full" id="show-changepw" style="margin-top:18px;">修改密碼</button>

  <!-- Change password form (hidden by default) -->
  <form id="changepw-form" class="space-y-4" style="display:none;">
    <p class="subtle text-sm">輸入帳號與目前密碼以設定新密碼（限教練 / 管理者帳號）。</p>
    <div>
      <label class="form-label" for="cp-email">電子郵件</label>
      <input id="cp-email" type="email" required class="form-input" placeholder="you@example.com" autocomplete="email">
    </div>
    <div>
      <label class="form-label" for="cp-current">目前密碼</label>
      <input id="cp-current" type="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div>
      <label class="form-label" for="cp-new">新密碼（至少 6 碼）</label>
      <input id="cp-new" type="password" required minlength="6" class="form-input" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div>
      <label class="form-label" for="cp-new2">確認新密碼</label>
      <input id="cp-new2" type="password" required class="form-input" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div id="cp-msg" class="text-sm" style="display:none;"></div>
    <button type="submit" class="btn btn-primary w-full" id="cp-btn">更新密碼</button>
    <button type="button" class="btn btn-ghost w-full" id="cp-back">返回登入</button>
  </form>

  <div class="login-note">
    <span class="dot"></span>
    此入口僅供授權員工使用
  </div>

</div>

<script type="module">
const $ = s => document.querySelector(s);

const loginForm = $('#login-form');

// Already logged in? bounce based on role
if (localStorage.getItem('chinup.token')) {
  fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${localStorage.getItem('chinup.token')}` }})
    .then(r => r.ok ? r.json() : null)
    .then(u => { if (u) location.href = u.is_admin ? '/admin.html' : u.role === 'coach' ? '/coach.html' : '/'; });
}

// Display OAuth error on URL (?err=xxx)
const err = new URLSearchParams(location.search).get('err');
if (err) {
  $('#login-err').textContent = `登入失敗：${err}`;
  $('#login-err').style.display = 'block';
}

// --- Login form ---
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const submit = $('#login-btn');
  const errEl = $('#login-err');
  errEl.style.display = 'none';
  submit.disabled = true; submit.textContent = '登入中…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error === 'invalid_credentials' ? '帳號或密碼錯誤' : (data.error || 'login failed'));
    localStorage.setItem('chinup.token', data.token);
    localStorage.setItem('chinup.user', JSON.stringify(data.user));
    const redirect = new URLSearchParams(location.search).get('redirect') || (data.user.is_admin ? '/admin.html' : data.user.role === 'coach' ? '/coach.html' : '/');
    location.href = redirect;
  } catch (e2) {
    errEl.textContent = e2.message;
    errEl.style.display = 'block';
    submit.disabled = false; submit.textContent = '登入';
  }
});

// --- Change password ---
const cpForm = $('#changepw-form');
const loginEls = [$('.btn-google'), $('.divider'), loginForm, $('#show-changepw')];
const showLogin = (showCp) => {
  loginEls.forEach(el => { if (el) el.style.display = showCp ? 'none' : ''; });
  cpForm.style.display = showCp ? '' : 'none';
};
$('#show-changepw').addEventListener('click', () => {
  if ($('#email').value.trim()) $('#cp-email').value = $('#email').value.trim();
  showLogin(true);
});
$('#cp-back').addEventListener('click', () => { $('#cp-msg').style.display = 'none'; showLogin(false); });

cpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#cp-email').value.trim();
  const currentPassword = $('#cp-current').value;
  const newPassword = $('#cp-new').value;
  const msgEl = $('#cp-msg');
  const btn = $('#cp-btn');
  const show = (text, ok) => { msgEl.textContent = text; msgEl.style.color = ok ? '#16a34a' : '#dc2626'; msgEl.style.display = 'block'; };
  msgEl.style.display = 'none';
  if (newPassword.length < 6) return show('新密碼至少 6 碼', false);
  if (newPassword !== $('#cp-new2').value) return show('兩次新密碼不一致', false);
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, currentPassword, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      const m = { invalid_credentials: '帳號或目前密碼錯誤', weak_password: '新密碼至少 6 碼', user_login_disabled: '此帳號不可修改密碼', missing_fields: '請填寫所有欄位' };
      throw new Error(m[data.error] || data.error || '修改失敗');
    }
    show('密碼已更新，請用新密碼登入', true);
    cpForm.reset();
    setTimeout(() => { $('#cp-msg').style.display = 'none'; showLogin(false); }, 1800);
  } catch (e2) {
    show(e2.message, false);
  } finally {
    btn.disabled = false; btn.textContent = '更新密碼';
  }
});
</script>
</body>
</html>
