<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>團體課程 – CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>
body { visibility: hidden; }

/* ── sticky price bar ── */
#price-bar {
  position: sticky;
  bottom: 0;
  z-index: 15;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#price-bar.hidden { display: none; }

/* ── session row (selectable) ── */
.sess-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  margin-bottom: 8px;
  transition: border-color 160ms, background 160ms;
  cursor: pointer;
}
.sess-row:hover { border-color: rgba(56,189,248,0.4); background: var(--brand-50); }
.sess-row.selected { border-color: var(--brand-600); background: #f0f9ff; }
.sess-row.waitlist-selected { border-color: #d97706; background: #fffbeb; }
.sess-row-info { flex: 1; min-width: 0; }
.sess-row-date { font-weight: 700; font-size: 14px; }
.sess-row-time { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.sess-row-cap { font-size: 12px; white-space: nowrap; color: var(--ink-mute); }

/* ── success panel ── */
#success-view { display: none; }

/* ── bank info box ── */
.bank-box {
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 14px;
}
.bank-box strong { display: block; font-size: 16px; font-weight: 700; margin: 4px 0 8px; color: var(--brand-900); }

/* ── full-width btn variant ── */
.btn-full { width: 100%; display: flex; }

/* ── LINE bind box ── */
.line-box {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 14px;
}
.line-code {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.15em;
  color: #15803d;
  margin: 6px 0;
}

/* ── select-all control ── */
.select-all-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--brand-700);
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 140ms;
}
.select-all-row:hover { background: var(--brand-50); }

/* =====================================================================
   NIKE TECH AESTHETIC OVERRIDE LAYER (group page)
   Loaded after style.css → wins on equal specificity. Visual only;
   no IDs/classes referenced by group.js are removed or renamed.
   ===================================================================== */
:root { --nike-tnum: tabular-nums; }

/* ---- shared Archivo kicker (uppercase + trailing hairline) ---- */
.nike-kicker {
  display: flex; align-items: center; gap: 12px;
  font-family: "Archivo", sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 14px;
}
.nike-kicker::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---- hero ---- */
.hero { padding: 36px 0 26px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "Archivo", sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-mute);
  background: none; border: none; padding: 0; border-radius: 0;
}
.hero-eyebrow::after { content: ""; width: 36px; height: 1px; background: var(--line); }
.hero h1 {
  font-family: "Noto Sans TC", sans-serif;
  font-weight: 900; letter-spacing: -0.01em; line-height: 1.12;
  margin-top: 16px; text-wrap: pretty;
}
.hero p { font-size: 15px; color: var(--ink-soft); line-height: 1.65; text-wrap: pretty; }

/* ---- card: honest borders, squared corners, no hover lift ---- */
.card {
  border-radius: 6px;
  box-shadow: none;
}
.card:hover { transform: none; box-shadow: none; border-color: var(--line); }
.section-title {
  font-family: "Noto Sans TC", sans-serif;
  font-weight: 900; letter-spacing: -0.01em;
}

/* ---- accordion (course template group) ---- */
.day-group {
  border-radius: 6px;
}
.day-group[open] { box-shadow: none; border-color: var(--brand-600); }
.day-group summary:hover { background: var(--brand-50); }
.day-chip {
  border-radius: 4px;
  background: var(--brand-50);
  color: var(--brand-700);
  box-shadow: none;
  font-family: "Archivo", sans-serif;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--brand-100);
}
.day-chip-unit { font-family: "Archivo", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
.day-group[open] .day-chip {
  background: var(--brand-600);
  color: #fff;
  box-shadow: none;
  border-color: var(--brand-600);
}
.day-title h3 { font-weight: 800; }
.day-group-content { background: var(--surface); }

/* template price badge → quiet Archivo label, not a filled pill */
.day-title h3 .badge.badge-open {
  background: none !important; border: none !important; padding: 0 !important;
  color: var(--brand-700) !important;
  font-family: "Archivo", sans-serif; font-weight: 800;
  letter-spacing: 0.01em; font-variant-numeric: tabular-nums;
}
.day-title h3 .badge.badge-open::before { display: none; }

/* course meta line-icons (replaces emoji) */
.course-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.course-meta .cm-item { display: inline-flex; align-items: center; gap: 5px; }
.course-meta .cm-item svg { width: 13px; height: 13px; flex: none; opacity: 0.7; }
.course-meta .cm-item .tnum { font-variant-numeric: tabular-nums; }

/* ---- select-all control ---- */
.select-all-row {
  font-family: "Archivo", sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-soft);
  border-radius: 4px;
}

/* ---- session rows (selectable) ---- */
.sess-row {
  border-radius: 6px;
  gap: 14px;
  padding: 14px 14px;
  min-height: 44px;
}
.sess-row:hover { border-color: rgba(14,165,233,0.4); background: var(--brand-50); }
.sess-row.selected { border-color: var(--brand-600); background: var(--brand-50); box-shadow: inset 3px 0 0 var(--brand-600); }
.sess-row.waitlist-selected { border-color: var(--warn-fg); background: var(--warn-bg); box-shadow: inset 3px 0 0 var(--warn-fg); }
.sess-row input[type=checkbox] { accent-color: var(--brand-600); }

/* split date block: bold tabular day-number + uppercase weekday */
.sess-date {
  flex: none; width: 50px; text-align: left;
  display: flex; flex-direction: column; gap: 4px;
}
.sess-date .d {
  font-family: "Archivo", sans-serif; font-weight: 800; font-size: 19px;
  color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums;
}
.sess-date .wd {
  font-family: "Archivo", sans-serif; font-weight: 700; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute);
}
.sess-row-info .name { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.3; }
.sess-row-info .time {
  margin-top: 3px; font-size: 12.5px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* capacity → dot + colored word, not a filled pill */
.sess-cap { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.sess-cap .dot-line { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
.sess-cap .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sess-cap .dot.ok { background: var(--ok-fg); }
.sess-cap .dot.warn { background: var(--warn-fg); }
.sess-cap .ok-t { color: var(--ok-fg); }
.sess-cap .warn-t { color: var(--warn-fg); }
.sess-cap .left-num { font-variant-numeric: tabular-nums; }
.sess-cap .sub {
  font-family: "Archivo", sans-serif; font-weight: 600; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute);
}

/* ---- order summary ---- */
#order-summary { border-radius: 6px; }
#summary-total { font-family: "Archivo", sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; }

/* ---- discount + buttons ---- */
.form-input, .form-select, .form-textarea { border-radius: 6px; }
.btn { border-radius: 6px; min-height: 40px; }
.btn-primary { box-shadow: none; border-radius: 6px; }
.btn-primary:hover { transform: none; }
.btn-sm { min-height: 40px; }

/* ---- sticky price bar ---- */
#price-bar {
  background: var(--surface);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
}
#price-bar > div:first-child .text-xs {
  font-family: "Archivo", sans-serif; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute);
}
#price-bar-total {
  font-family: "Archivo", sans-serif; font-weight: 900;
  font-variant-numeric: tabular-nums; color: var(--ink) !important;
  letter-spacing: -0.01em;
}
#price-bar-go { min-height: 44px; padding: 0 20px; }

/* ---- success view ---- */
.success-head { text-align: center; padding: 22px 0 18px; }
.success-head .nike-kicker { display: inline-flex; margin: 0 0 6px; }
.success-head .nike-kicker::after { display: none; }
.success-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; border-radius: 50%;
  border: 1.5px solid var(--ok-line); color: var(--ok-fg);
  margin-bottom: 14px;
}
.success-mark svg { width: 22px; height: 22px; }
.success-head h1 { font-family: "Noto Sans TC", sans-serif; font-weight: 900; }

/* ---- bank box: honest border, no soft tint card ---- */
.bank-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--brand-600);
  border-radius: 6px;
}
.bank-box strong { font-family: "Archivo", sans-serif; font-weight: 800; color: var(--ink); }

/* ---- empty / loading ---- */
.empty-state { border-radius: 6px; }
.empty-state-icon { color: var(--ink-mute); opacity: 0.5; }
.empty-state-icon svg { width: 40px; height: 40px; display: inline-block; }
.skeleton { border-radius: 6px !important; }
</style>
</head>
<body>

<nav class="navbar sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/" class="brand-mark">
        <span class="brand-dot"><img src="/logo.png" alt="logo"></span> CHINUP Performance
      </a>
      <div class="hidden md:flex items-center gap-6">
        <a href="/" class="nav-link">課程</a>
        <a href="/coaches.html" class="nav-link">一對一預約</a>
        <a href="/my-schedule" class="nav-link">我的課表</a>
        <a href="/login.html" class="nav-link">登入</a>
        <a href="/admin.html" class="nav-link admin-only hidden">管理後台</a>
        <a href="/coach.html" class="nav-link coach-only hidden">教練後台</a>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-bar" class="flex items-center gap-3"></div>
      <button id="nav-toggle" class="md:hidden nav-toggle-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
  </div>
  <div id="nav-mobile" class="hidden md:hidden">
    <div class="max-w-6xl mx-auto px-6 py-2 flex flex-col">
      <a href="/" class="nav-link-mobile">課程</a>
      <a href="/coaches.html" class="nav-link-mobile">一對一預約</a>
      <a href="/my-schedule" class="nav-link-mobile">我的課表</a>
      <a href="/login.html" class="nav-link-mobile">登入</a>
      <a href="/admin.html" class="nav-link-mobile admin-only hidden">管理後台</a>
      <a href="/coach.html" class="nav-link-mobile coach-only hidden">教練後台</a>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 pb-32">

  <!-- Hero -->
  <section class="hero" style="padding-bottom:20px;">
    <span class="hero-eyebrow">Group Class · 團體課程</span>
    <h1 style="font-size:clamp(24px,4vw,36px);">選課 &amp; 匯款報名</h1>
    <p>選擇場次、填寫資料後以銀行轉帳完成報名。額滿場次可選候補。</p>
  </section>

  <!-- Loading skeleton -->
  <div id="loading" class="flex flex-col gap-4 mt-2">
    <div class="skeleton" style="height:72px;border-radius:14px;"></div>
    <div class="skeleton" style="height:72px;border-radius:14px;"></div>
    <div class="skeleton" style="height:72px;border-radius:14px;"></div>
  </div>

  <!-- Empty state -->
  <div id="empty" class="empty-state hidden mt-4">
    <span class="empty-state-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3 9h18"></path>
        <path d="M8 14h8"></path>
      </svg>
    </span>
    <p>目前沒有開放報名的團體課程，請稍後再查看。</p>
  </div>

  <!-- Course list -->
  <div id="course-list" class="hidden mt-2"></div>

  <!-- Booking form (hidden until user has selections) -->
  <section id="booking-form-section" class="hidden mt-8">
    <div class="card">
      <span class="nike-kicker">Checkout · 報名資料</span>
      <h2 class="section-title mb-4">填寫報名資料</h2>

      <div id="form-error" class="hidden mb-4 p-3 rounded-lg text-sm" style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;"></div>

      <form id="booking-form" autocomplete="on" novalidate>
        <div class="mb-4">
          <label class="form-label" for="f-name">姓名 *</label>
          <input id="f-name" name="name" class="form-input" type="text" required placeholder="請輸入真實姓名" autocomplete="name">
        </div>
        <div class="mb-4">
          <label class="form-label" for="f-phone">電話 *</label>
          <input id="f-phone" name="phone" class="form-input" type="text" inputmode="numeric" required placeholder="09xxxxxxxx" autocomplete="tel">
        </div>

        <!-- Order summary -->
        <div id="order-summary" class="mb-4 p-3 rounded-lg text-sm" style="background:#f8fafc;border:1px solid var(--line);">
          <div class="font-semibold mb-1" style="color:var(--ink);">訂單摘要</div>
          <div id="summary-pay-list" class="text-slate-600"></div>
          <div id="summary-wait-list" class="text-amber-700 mt-1"></div>
          <div id="discount-line" class="hidden mt-1 pt-1" style="border-top:1px solid var(--line);color:#15803d;">
            <span id="discount-line-text"></span>
          </div>
          <div class="mt-2 pt-2" style="border-top:1px solid var(--line);">
            <span class="font-bold" style="color:var(--ink);">應付金額：</span>
            <span id="summary-total" class="font-bold text-lg" style="color:var(--brand-700);">NT$0</span>
          </div>
        </div>

        <!-- Discount code -->
        <div class="mb-4">
          <label class="form-label" for="discount-code">折扣碼（選填）</label>
          <div class="flex gap-2">
            <input id="discount-code" name="discountCode" class="form-input" type="text" placeholder="輸入折扣碼" autocomplete="off" style="flex:1;">
            <button id="apply-discount" type="button" class="btn btn-ghost" style="white-space:nowrap;">套用</button>
          </div>
          <div id="discount-msg" class="hidden mt-1 text-sm"></div>
        </div>

        <button id="submit-btn" type="submit" class="btn btn-primary btn-full">
          確認報名並送出
        </button>
      </form>
    </div>
  </section>

  <!-- Success view -->
  <section id="success-view">
    <div class="success-head">
      <span class="success-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 13 10 18 19 6"></polyline>
        </svg>
      </span>
      <span class="nike-kicker">Confirmed · 報名完成</span>
      <h1 class="section-title text-2xl">報名成功</h1>
      <p class="subtle mt-1">請依下方資訊完成匯款，以確保報名生效。</p>
    </div>

    <div class="card mb-4" id="success-order-info"></div>
    <div class="bank-box mb-4" id="success-bank-info"></div>
    <div id="success-waitlist" class="hidden mb-4 p-3 rounded-lg text-sm" style="background:#fffbeb;border:1px solid #fcd34d;color:#92400e;"></div>
    <div id="success-line-box" class="line-box hidden mb-4"></div>

    <div class="flex flex-col gap-3 mt-6">
      <a href="/my-schedule" class="btn btn-primary btn-full" style="justify-content:center;">查我的課表</a>
      <a href="/" class="btn btn-ghost btn-full" style="justify-content:center;">回首頁</a>
    </div>
  </section>

</main>

<!-- Sticky price bar -->
<div id="price-bar" class="hidden">
  <div>
    <div class="text-xs font-semibold" style="color:var(--ink-mute);">已選付款場次</div>
    <div id="price-bar-total" class="text-xl font-bold" style="color:var(--brand-700);">NT$0</div>
  </div>
  <button id="price-bar-go" class="btn btn-primary btn-sm" disabled>填寫資料 →</button>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="/group.js"></script>
</body>
</html>
