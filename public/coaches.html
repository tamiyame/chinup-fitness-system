<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一對一預約 · CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>body { visibility: hidden; }</style>
</head>
<body>
<nav class="navbar sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/" class="brand-mark">
        <span class="brand-dot"><img src="/logo.png" alt="logo"></span> CHINUP Performance
      </a>
      <div class="hidden md:flex items-center gap-6">
        <a href="/" class="nav-link">課程</a>
        <a href="/coaches.html" class="nav-link active">一對一預約</a>
        <a href="/my-schedule" class="nav-link">我的課表</a>
        <a href="/line.html" class="nav-link">🔔 LINE 通知</a>
        <a href="/admin.html" class="nav-link">管理後台</a>
        <a href="/coach.html" class="nav-link coach-only hidden">教練後台</a>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-bar" class="flex items-center gap-3"></div>
      <button id="nav-toggle" class="md:hidden nav-toggle-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
  </div>
  <div id="nav-mobile" class="hidden md:hidden">
    <div class="max-w-6xl mx-auto px-6 py-2 flex flex-col">
      <a href="/" class="nav-link-mobile">課程</a>
      <a href="/coaches.html" class="nav-link-mobile active">一對一預約</a>
      <a href="/my-schedule" class="nav-link-mobile">我的課表</a>
      <a href="/line.html" class="nav-link-mobile">🔔 LINE 通知</a>
      <a href="/admin.html" class="nav-link-mobile">管理後台</a>
      <a href="/coach.html" class="nav-link-mobile coach-only hidden">教練後台</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8">
  <div id="view-list">
    <h1 class="page-title">選擇教練</h1>

    <section id="recent-section" class="hidden">
      <div class="section-recent-label">
        <span>你最近的教練</span>
        <span id="recent-ago" class="ago-badge"></span>
      </div>
      <div id="recent-mount"></div>
    </section>

    <section id="all-section">
      <div class="section-all-label">全部教練</div>
      <div id="coach-list"></div>
    </section>
  </div>

  <div id="view-detail" class="hidden">
    <button id="back-to-list" class="text-sm text-sky-600 mb-3">← 回到教練列表</button>
    <div id="coach-detail"></div>
    <h2 class="section-title mt-6">可預約時段</h2>
    <div id="slot-controls" class="flex items-center gap-3 mb-3"></div>
    <div id="slot-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
  </div>

  <div id="view-confirm" class="hidden">
    <button id="back-to-detail" class="text-sm text-sky-600 mb-3">← 選別的時段</button>
    <h1 class="page-title">確認預約</h1>
    <div id="confirm-summary" class="card mb-4"></div>
    <label class="block mb-3">
      <span class="text-sm text-slate-600">備註（選填）</span>
      <textarea id="note" class="mt-1 w-full border rounded p-2 text-sm" rows="3" placeholder="例如：想加強核心訓練"></textarea>
    </label>
    <button id="confirm-btn" class="btn-primary w-full">確認預約</button>
  </div>
</main>

<div id="toast" class="toast"></div>
<script type="module" src="/coaches.js"></script>
</body>
</html>
