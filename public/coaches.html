<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一對一預約 · CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>body { visibility: hidden; }</style>
</head>
<body>
<nav class="navbar sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/" class="brand-mark">
        <span class="brand-dot"><img src="/logo.png" alt="logo"></span> CHINUP Performance
      </a>
      <div class="hidden md:flex items-center gap-6">
        <a href="/" class="nav-link">課程</a>
        <a href="/coaches.html" class="nav-link active">一對一預約</a>
        <a href="/my-schedule" class="nav-link">我的課表</a>
        <a href="/login.html" class="nav-link">登入</a>
        <a href="/admin.html" class="nav-link admin-only hidden">管理後台</a>
        <a href="/coach.html" class="nav-link coach-only hidden">教練後台</a>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-bar" class="flex items-center gap-3"></div>
      <button id="nav-toggle" class="md:hidden nav-toggle-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
  </div>
  <div id="nav-mobile" class="hidden md:hidden">
    <div class="max-w-6xl mx-auto px-6 py-2 flex flex-col">
      <a href="/" class="nav-link-mobile">課程</a>
      <a href="/coaches.html" class="nav-link-mobile active">一對一預約</a>
      <a href="/my-schedule" class="nav-link-mobile">我的課表</a>
      <a href="/login.html" class="nav-link-mobile">登入</a>
      <a href="/admin.html" class="nav-link-mobile admin-only hidden">管理後台</a>
      <a href="/coach.html" class="nav-link-mobile coach-only hidden">教練後台</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8">
  <div id="view-list">
    <h1 class="page-title">選擇教練</h1>

    <section id="all-section">
      <div class="section-all-label">全部教練</div>
      <div id="coach-list"></div>
    </section>
  </div>

  <div id="view-detail" class="hidden">
    <!-- 返回列表 -->
    <button id="back-to-list" class="text-sm text-sky-600 mb-3">← 回到教練列表</button>
    <!-- 教練標頭（頭像 + 名字 + 專長）由 JS 填入 -->
    <div id="coach-detail"></div>

    <!-- 可預約時段區塊 -->
    <h2 class="section-title mt-6">可預約時段</h2>
    <!-- 上/下週導覽（由 JS renderSlotControls 填入）-->
    <div id="slot-controls" class="flex items-center gap-3 mb-3"></div>
    <!-- 日期橫向 rail（由 JS 填入）-->
    <div id="day-rail" class="dayrail"></div>
    <!-- 當日時段標題（由 JS 填入）-->
    <div id="slot-day-head" class="slot-day-head" style="display:none"></div>
    <!-- 3 欄時段卡 grid（由 JS 填入）-->
    <div id="slot-grid" class="timegrid"></div>
  </div>

  <div id="view-success" class="hidden"></div>
</main>

<!-- Booking Modal -->
<div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="flex items-center justify-between p-4 border-b">
      <h2 id="modal-title" class="text-lg font-bold">填寫預約資訊</h2>
      <button id="modal-close-btn" class="text-slate-400 hover:text-slate-700 text-xl leading-none" aria-label="關閉">✕</button>
    </div>
    <div class="p-4">
      <div class="card bg-slate-50 mb-4 text-sm">
        <div class="mb-1"><span class="text-slate-500">教練：</span><strong id="modal-coach-name"></strong></div>
        <div><span class="text-slate-500">時間：</span><strong id="modal-slot-time"></strong></div>
      </div>

      <div class="mb-3">
        <span class="text-sm font-medium text-slate-700 block mb-1">課程型態 <span class="text-red-500">*</span></span>
        <div id="modal-session-type" class="grid grid-cols-2 gap-2" role="group" aria-label="課程型態">
          <button type="button" data-type="1on1" class="session-type-btn border rounded-lg px-3 py-2 text-sm font-medium transition-colors">1對1</button>
          <button type="button" data-type="1on2" class="session-type-btn border rounded-lg px-3 py-2 text-sm font-medium transition-colors">1對2</button>
        </div>
      </div>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">姓名 <span class="text-red-500">*</span></span>
        <input id="modal-name" type="text" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="請輸入真實姓名">
        <span id="modal-name-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">電話 <span class="text-red-500">*</span></span>
        <input id="modal-phone" type="tel" inputmode="numeric" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="例：0912345678">
        <span id="modal-phone-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">Email（選填，填寫將寄送預約確認信）</span>
        <input id="modal-email" type="email" inputmode="email" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="example@email.com">
        <span id="modal-email-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <div id="modal-price-row" class="text-sm text-slate-600 mb-3 hidden">
        <span id="modal-price-label"></span>
      </div>

      <div class="mb-3">
        <div class="flex gap-2">
          <input id="modal-discount-code" type="text" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="折扣碼（選填）">
          <button id="modal-apply-discount" type="button" class="btn-secondary text-sm px-3">套用</button>
        </div>
        <span id="modal-discount-msg" class="text-xs mt-1 block hidden"></span>
      </div>

      <span id="modal-general-err" class="text-sm text-red-600 block mb-3"></span>

      <button id="modal-submit-btn" class="btn-primary w-full">確認預約</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script type="module" src="/coaches.js"></script>
</body>
</html>
