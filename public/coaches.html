<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一對一預約 · CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>
body { visibility: hidden; }

/* ============================================================
   Nike 技術美學 overlay — coaches 一對一預約
   疊在 style.css 之後，同特異性勝出；不改 markup 結構/ID。
   DNA：Archivo 粗體數字錨點 + Noto Sans TC 內文；單一 sky 強調色；
   狀態用小圓點 + 色字；實心俐落按鈕；細線分隔；tabular-nums；無 emoji/漸層。
   ============================================================ */

:root{ --nk-acc:var(--brand-600); --nk-acc-strong:var(--brand-700); }

/* 全域：中文直角引號傾向 + tabular nums 給數字錨點 */
.tnum, .archivo { font-variant-numeric: tabular-nums; }

/* Archivo 大寫小標 + 尾端細線（kicker）；JS 無此 class，純視覺用 */
.nk-kicker{
  font-family:"Archivo",sans-serif; font-weight:700; font-size:11px;
  text-transform:uppercase; letter-spacing:.2em; color:var(--ink-mute);
  display:flex; align-items:center; gap:10px;
}
.nk-kicker::after{ content:""; flex:1; height:1px; background:var(--line); }

/* ---------- 頁面標題 ---------- */
.page-title{
  font-family:"Noto Sans TC",sans-serif;
  font-weight:900; letter-spacing:-.01em;
}

/* 「全部教練」標籤 → Archivo 大寫 kicker + 尾線 */
.section-all-label{
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-mute);
  display:flex; align-items:center; gap:10px;
  margin:20px 0 14px;
}
.section-all-label::after{ content:""; flex:1; height:1px; background:var(--line); }

/* 返回列表：Archivo 小標質感 */
#back-to-list{
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-soft);
}
#back-to-list:hover{ color:var(--nk-acc-strong); }

/* ---------- 教練列表卡（cardHtml）→ Nike 俐落卡 ---------- */
.ccard{
  border-radius:10px;
  border:1px solid var(--line);
  box-shadow:none;
  padding:12px;
  gap:13px;
  margin-bottom:10px;
  transition:border-color .15s ease, background .15s ease;
}
.ccard:hover{ transform:none; box-shadow:none; border-color:var(--ink-mute); }
.ccard.expanded{
  border-radius:10px 10px 0 0;
  box-shadow:none;
  border-bottom-color:transparent;
  border-left:3px solid var(--nk-acc);
  padding-left:14px;
}

/* 頭像 → 方形（小圓角）描邊；首字用 Archivo 粗黑 */
.ccard-avatar{
  width:54px; height:54px;
  border-radius:6px;
  background:#eef2f6;
  border:1px solid var(--line);
  box-shadow:none;
}
.ccard-avatar-fallback{
  font-family:"Archivo",sans-serif; font-weight:900;
  font-size:22px; color:var(--ink-mute);
}

.ccard-name{
  font-family:"Noto Sans TC",sans-serif;
  font-weight:900; font-size:16px; letter-spacing:-.01em;
}

/* 專長：Archivo 大寫小標（非膠囊標籤）；用「/」分隔感 */
.ccard-tags{ margin-top:3px; gap:0; }
.ccard .tag{
  background:transparent; border:none; padding:0;
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-mute);
  white-space:nowrap;
}
.ccard .tag + .tag::before{
  content:"/"; color:var(--line); margin:0 6px; font-weight:600;
}

/* 右側 chevron → 方形描邊小鍵，非圓填色 */
.ccard-go{
  width:auto; height:auto; border-radius:0; background:transparent;
  font-family:"Archivo",sans-serif; font-weight:800; font-size:18px;
  color:var(--ink-mute);
}
.ccard.expanded .ccard-go{
  background:transparent; color:var(--nk-acc);
  transform:rotate(90deg);
}

/* ---------- 展開面板 ---------- */
.ccard-expand{
  border-radius:0 0 10px 10px;
  border:1px solid var(--line);
  border-top:none;
  border-left:3px solid var(--nk-acc);
  box-shadow:none;
  padding:6px 16px 16px 14px;
  margin-bottom:10px;
}
.ccard-expand::before{ left:14px; }
.bioA{ font-size:13px; line-height:1.6; }

/* 「最近可預約」小標 → Archivo kicker + 尾線 */
.slotlabel{
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-mute);
  display:flex; align-items:center; gap:10px;
  margin:14px 0 10px;
}
.slotlabel::after{ content:""; flex:1; height:1px; background:var(--line); }

/* 橫向 mini 時段卡 → 方形俐落 + Archivo tabular 時間 */
.miniSlot{
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 12px;
  transition:border-color .15s ease, background .15s ease;
}
.miniSlot:hover{ border-color:var(--nk-acc); background:var(--brand-50); }
.miniSlot .md{ font-family:"Noto Sans TC",sans-serif; font-size:10px; color:var(--ink-mute); font-weight:500; }
.miniSlot .tm{
  font-family:"Archivo",sans-serif; font-variant-numeric:tabular-nums;
  font-size:16px; font-weight:800; letter-spacing:-.01em; color:var(--ink);
}
.miniSlot-more{
  border:1px dashed var(--line);
  border-radius:8px;
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--nk-acc);
}
.miniSlot-more:hover{ background:var(--brand-50); border-color:var(--nk-acc); }

/* 展開 CTA → 實心俐落直角小圓角 */
.ctaA{
  border-radius:8px;
  padding:0; height:46px;
  box-shadow:none;
  font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:15px;
  background:var(--nk-acc);
  display:flex; align-items:center; justify-content:center;
}
.ctaA:hover{ background:var(--nk-acc-strong); }

/* ---------- 教練詳細標頭（openCoach）---------- */
.detail-head{ gap:16px; margin-bottom:18px; align-items:flex-start; }
.detail-av{
  width:84px; height:84px;
  border-radius:6px;
  background:#eef2f6;
  border:1px solid var(--line);
  box-shadow:none;
}
.detail-av-fallback{
  font-family:"Archivo",sans-serif; font-weight:900;
  font-size:38px; color:var(--ink-mute);
}
.detail-name{
  font-family:"Noto Sans TC",sans-serif;
  font-weight:900; font-size:26px; letter-spacing:-.01em; line-height:1.1;
}
/* 詳細頁專長：把膠囊標籤改為 Archivo 大寫小標 + 「/」分隔 */
.detail-spec{
  margin-top:9px;
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--nk-acc-strong);
}
.detail-spec .tag{
  background:transparent; border:none; padding:0;
  font-family:"Archivo",sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--nk-acc-strong); white-space:nowrap;
}
.detail-spec .tag + .tag::before{
  content:"/"; color:var(--ink-mute); margin:0 6px; font-weight:600;
}

/* ---------- 可預約時段 標題列 ---------- */
.slot-title{
  font-family:"Noto Sans TC",sans-serif;
  font-weight:900; letter-spacing:-.01em;
}
#slot-yearmonth{
  font-family:"Archivo",sans-serif; font-variant-numeric:tabular-nums;
  font-weight:700; font-size:13px; letter-spacing:.02em;
  color:var(--nk-acc-strong);
  background:var(--brand-50);
  border:1px solid var(--brand-100);
  border-radius:999px;
  padding:4px 11px;
}
/* 週次導覽鍵 → 方形小圓角描邊 */
.day-nav-btn{
  border-radius:8px;
  font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:12px;
  padding:6px 11px;
  color:var(--ink-soft);
}
.day-nav-btn:hover:not(:disabled){ border-color:var(--nk-acc); background:var(--brand-50); }
.day-nav-arrow{
  font-family:"Archivo",sans-serif; font-weight:700; font-size:15px;
  padding:6px 11px; color:var(--ink-soft);
}

/* ---------- 日期 rail（已近 Nike，微調為方形 + Archivo 數字）---------- */
.daypill{
  border-radius:10px;
  border:1px solid var(--line);
  padding:9px 2px 8px;
  transition:border-color .15s ease, background .15s ease;
}
.daypill .dow{ font-family:"Noto Sans TC",sans-serif; font-weight:700; font-size:11px; color:var(--ink-mute); }
.daypill .dnum{
  font-family:"Archivo",sans-serif; font-variant-numeric:tabular-nums;
  font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--ink);
}
.daypill .ddot{ background:var(--nk-acc); }
.daypill.sel{
  background:var(--nk-acc);
  border-color:var(--nk-acc);
  box-shadow:none;
}
.daypill.sel .ddot{ background:#fff; }

/* 當日時段標題 */
.slot-day-head{
  font-family:"Noto Sans TC",sans-serif; font-weight:900;
  margin:18px 0 12px;
}
.slot-day-head small{ font-family:"Noto Sans TC",sans-serif; font-weight:500; }

/* ---------- 時段格（renderTimegrid）→ Nike 俐落格 ---------- */
.timegrid{ gap:8px; }
.timeslot{
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 8px 11px;
  transition:border-color .15s ease, background .15s ease;
}
.timeslot:hover{ border-color:var(--nk-acc); background:var(--brand-50); transform:none; }
.timeslot .t-main{
  font-family:"Archivo",sans-serif; font-variant-numeric:tabular-nums;
  font-weight:800; font-size:18px; letter-spacing:-.01em; color:var(--ink);
}
.timeslot .t-sub{
  font-family:"Noto Sans TC",sans-serif; font-weight:500;
  font-size:11px; color:var(--ink-mute); margin-top:3px;
}
.timeslot.sel{ background:var(--nk-acc); border-color:var(--nk-acc); box-shadow:none; }

/* 剩 1 名額 → 琥珀小圓點 + 色字（非填色）；以含「剩」字的時段卡判定 */
.timeslot.ts-warn .t-sub{
  display:inline-flex; align-items:center; gap:5px;
  color:var(--warn-fg); font-weight:700;
}
.timeslot.ts-warn .t-sub::before{
  content:""; width:5px; height:5px; border-radius:50%; background:var(--warn-fg);
}
/* 過去補登：沿用虛線琥珀邊界（誠實邊界）*/
.timeslot.slot-past{ border-style:dashed; border-color:var(--warn-line); background:#fffdf5; }
.timeslot.slot-past .t-main{ color:var(--ink-soft); }
.timeslot.slot-past .t-sub{ color:var(--warn-fg); }

/* ---------- 預約 Modal（輕度套色，功能不動）---------- */
#booking-modal .session-type-btn{
  border-radius:8px;
  font-family:"Noto Sans TC",sans-serif; font-weight:700;
}
#booking-modal #price-1on1, #booking-modal #price-1on2{
  font-variant-numeric:tabular-nums;
}
#booking-modal .btn-primary{ border-radius:8px; }
#booking-modal input[type="text"],
#booking-modal input[type="tel"],
#booking-modal input[type="email"],
#booking-modal input[type="number"],
#booking-modal select{ border-radius:8px; }
#booking-modal .rounded-xl{ border-radius:10px; }
#modal-title{ font-family:"Noto Sans TC",sans-serif; font-weight:900; }

/* ---------- 成功頁 / 循環成功頁：移除 emoji 大字，改 Archivo 標記 ---------- */
.nk-success-mark{
  font-family:"Archivo",sans-serif; font-weight:800;
  font-size:12px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ok-fg);
  display:inline-flex; align-items:center; gap:8px;
  margin-bottom:12px;
}
.nk-success-mark::before{
  content:""; width:7px; height:7px; border-radius:50%; background:var(--ok-fg);
}
</style>
</head>
<body>
<nav class="navbar sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/" class="brand-mark">
        <span class="brand-dot"><img src="/logo.png" alt="logo"></span> CHINUP Performance
      </a>
      <div class="hidden md:flex items-center gap-6">
        <a href="/" class="nav-link">課程</a>
        <a href="/coaches.html" class="nav-link active">一對一預約</a>
        <a href="/my-schedule" class="nav-link">我的課表</a>
        <a href="/login.html" class="nav-link">登入</a>
        <a href="/admin.html" class="nav-link admin-only hidden">管理後台</a>
        <a href="/coach.html" class="nav-link coach-only hidden">教練後台</a>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-bar" class="flex items-center gap-3"></div>
      <button id="nav-toggle" class="md:hidden nav-toggle-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
  </div>
  <div id="nav-mobile" class="hidden md:hidden">
    <div class="max-w-6xl mx-auto px-6 py-2 flex flex-col">
      <a href="/" class="nav-link-mobile">課程</a>
      <a href="/coaches.html" class="nav-link-mobile active">一對一預約</a>
      <a href="/my-schedule" class="nav-link-mobile">我的課表</a>
      <a href="/login.html" class="nav-link-mobile">登入</a>
      <a href="/admin.html" class="nav-link-mobile admin-only hidden">管理後台</a>
      <a href="/coach.html" class="nav-link-mobile coach-only hidden">教練後台</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8">
  <div id="view-list">
    <h1 class="page-title">選擇教練</h1>

    <section id="all-section">
      <div class="section-all-label">全部教練</div>
      <div id="coach-list"></div>
    </section>
  </div>

  <div id="view-detail" class="hidden">
    <!-- 返回列表 -->
    <button id="back-to-list" class="text-sm text-sky-600 mb-3">← 回到教練列表</button>
    <!-- 教練標頭（頭像 + 名字 + 專長）由 JS 填入 -->
    <div id="coach-detail"></div>

    <!-- 可預約時段：標題 + 年月（yyyy/mm）/ 右側週次導覽（今天・上一週・下一週，由 JS 填入）-->
    <div class="slot-head mt-6 mb-3">
      <h2 class="section-title slot-title">可預約時段<span id="slot-yearmonth"></span></h2>
      <div id="slot-controls" class="flex items-center gap-2"></div>
    </div>
    <!-- 日期橫向 rail（由 JS 填入）-->
    <div id="day-rail" class="dayrail"></div>
    <!-- 當日時段標題（由 JS 填入）-->
    <div id="slot-day-head" class="slot-day-head" style="display:none"></div>
    <!-- 3 欄時段卡 grid（由 JS 填入）-->
    <div id="slot-grid" class="timegrid"></div>
  </div>

  <div id="view-success" class="hidden"></div>
</main>

<!-- Booking Modal -->
<div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <!-- 限高 + 內容區滾動：循環預約/預覽展開時彈窗不得超出視窗（標題列固定） -->
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title"
       style="max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;">
    <div class="flex items-center justify-between p-4 border-b" style="flex-shrink:0;">
      <h2 id="modal-title" class="text-lg font-bold">填寫預約資訊</h2>
      <button id="modal-close-btn" class="text-slate-400 hover:text-slate-700 text-xl leading-none" aria-label="關閉">✕</button>
    </div>
    <div class="p-4" style="overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch;">
      <div class="card bg-slate-50 mb-4 text-sm">
        <div class="mb-1"><span class="text-slate-500">教練：</span><strong id="modal-coach-name"></strong></div>
        <div><span class="text-slate-500">時間：</span><strong id="modal-slot-time"></strong></div>
        <!-- 員工限定：循環預約（登入教練/管理者才顯示；後端 requireCoach 強制） -->
        <div id="recurring-row" class="hidden mt-2 pt-2" style="border-top:1px solid #e2e8f0;">
          <label class="flex items-center gap-2 text-sm font-medium text-slate-700" style="cursor:pointer;">
            <input id="recurring-enabled" type="checkbox" style="accent-color:var(--brand-600);width:15px;height:15px;flex-shrink:0;">
            開啟循環預約（員工排課）
          </label>
        </div>
      </div>

      <!-- 循環預約設定（勾選後展開） -->
      <div id="recurring-fields" class="hidden card mb-4 text-sm" style="background:var(--brand-50);border:1px solid var(--brand-100);">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <label class="block">
            <span class="text-xs font-medium text-slate-600">重複頻率</span>
            <select id="recurring-frequency" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm bg-white">
              <option value="weekly" selected>每週</option>
              <option value="daily">每日</option>
              <option value="monthly">每月</option>
              <option value="custom">自訂間隔</option>
            </select>
          </label>
          <label class="block">
            <span class="text-xs font-medium text-slate-600">共幾次（含本堂）</span>
            <input id="recurring-count" type="number" min="2" max="52" step="1" value="4" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm">
          </label>
        </div>
        <label id="recurring-interval-row" class="block mb-2 hidden">
          <span class="text-xs font-medium text-slate-600">每幾天重複一次（1–90）</span>
          <input id="recurring-interval" type="number" min="1" max="90" step="1" value="3" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm">
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-700 mb-2" style="cursor:pointer;">
          <input id="recurring-markpaid" type="checkbox" style="accent-color:#16a34a;width:15px;height:15px;flex-shrink:0;">
          款項已收（包堂/預付，直接標記已核對）
        </label>
        <button id="recurring-preview-btn" type="button" class="btn-secondary w-full text-sm">預覽場次</button>
        <div id="recurring-preview-result" class="mt-2 hidden text-xs" style="max-height:180px;overflow-y:auto;"></div>
      </div>

      <div class="mb-3">
        <span class="text-sm font-medium text-slate-700 block mb-1">課程型態 <span class="text-red-500">*</span></span>
        <div id="modal-session-type" class="grid grid-cols-2 gap-2" role="group" aria-label="課程型態">
          <button type="button" data-type="1on1" class="session-type-btn border rounded-lg px-3 py-2 text-sm font-medium transition-colors">1對1<span id="price-1on1" class="block text-xs font-normal mt-0.5 opacity-80"></span></button>
          <button type="button" data-type="1on2" class="session-type-btn border rounded-lg px-3 py-2 text-sm font-medium transition-colors">1對2<span id="price-1on2" class="block text-xs font-normal mt-0.5 opacity-80"></span></button>
        </div>
      </div>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">姓名 <span class="text-red-500">*</span></span>
        <input id="modal-name" type="text" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="請輸入真實姓名">
        <span id="modal-name-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">電話 <span class="text-red-500">*</span></span>
        <input id="modal-phone" type="tel" inputmode="numeric" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="例：0912345678">
        <span id="modal-phone-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <label class="block mb-3">
        <span class="text-sm font-medium text-slate-700">Email（選填，填寫將寄送預約確認信）</span>
        <input id="modal-email" type="email" inputmode="email" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="example@email.com">
        <span id="modal-email-err" class="text-xs text-red-500 mt-1 block"></span>
      </label>

      <div id="modal-price-row" class="text-sm text-slate-600 mb-3 hidden">
        <span id="modal-price-label"></span>
      </div>

      <div class="mb-3">
        <div class="flex gap-2">
          <input id="modal-discount-code" type="text" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="折扣碼（選填）">
          <button id="modal-apply-discount" type="button" class="btn-secondary text-sm px-3">套用</button>
        </div>
        <span id="modal-discount-msg" class="text-xs mt-1 block hidden"></span>
      </div>

      <span id="modal-general-err" class="text-sm text-red-600 block mb-3"></span>

      <button id="modal-submit-btn" class="btn-primary w-full">確認預約</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script type="module" src="/coaches.js"></script>
</body>
</html>
