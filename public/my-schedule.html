<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的課表 · CHINUP Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/style.css">
<style>
  body { visibility: hidden; }
  .tab-bar {
    display: flex;
    gap: 0;
    background: #f1f5f9;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 14px;
    border-radius: 7px;
    color: #64748b;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-btn.active {
    background: #fff;
    color: #0f172a;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .pill-kind {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
  }
  .pill-1on1  { background: #dbeafe; color: #1e40af; }
  .pill-group { background: #fce7f3; color: #9d174d; }
  .past-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    margin-top: 16px;
    border-top: 1px solid #e2e8f0;
    color: #64748b;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .past-list .card,
  .past-card { opacity: 0.72; }
  /* 我的課表卡片 · 運動力學壓縮版（日期錨點 / 2 行內容 / 動作鈕右側；無 emoji、無彩條圓角卡） */
  .sn-list { list-style: none; }
  .sn-row {
    position: relative;
    display: grid;
    grid-template-columns: 46px 1fr auto;
    column-gap: 13px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .sn-row.is-next { padding-left: 13px; margin-left: -13px; }
  .sn-row.is-next::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--brand-600); }
  .sn-date { text-align: left; }
  .sn-dow { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: .14em; color: var(--ink-mute); display: block; line-height: 1; }
  .sn-dnum { font-family: "Archivo", sans-serif; font-weight: 900; font-size: 26px; line-height: .92; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; display: block; margin-top: 2px; }
  .sn-row.is-next .sn-dnum { color: var(--brand-700); }
  .sn-mon { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 10px; letter-spacing: .08em; color: var(--ink-mute); display: block; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .sn-body { min-width: 0; }
  .sn-l1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sn-kind { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: .1em; color: var(--brand-700); border: 1px solid var(--brand-100); background: var(--brand-50); padding: 2px 6px 1px; line-height: 1; white-space: nowrap; }
  .sn-next { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; color: #fff; background: var(--brand-600); padding: 2px 5px 1px; line-height: 1; }
  .sn-title { font-weight: 900; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.2; color: var(--ink); }
  .sn-lead { font-weight: 500; font-size: 12.5px; color: var(--ink-mute); letter-spacing: .04em; margin-right: 1px; }
  .sn-l2 { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 3px; }
  .sn-time { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: .02em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .sn-clock { font-weight: 800; color: var(--ink); }
  .sn-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; }
  .sn-dot { width: 6px; height: 6px; flex: none; }
  .sn-status.ok { color: var(--ok-fg); } .sn-status.ok .sn-dot { background: var(--ok-fg); }
  .sn-status.warn { color: var(--warn-fg); } .sn-status.warn .sn-dot { background: var(--warn-fg); transform: rotate(45deg); }
  .sn-status.err { color: var(--err-fg); } .sn-status.err .sn-dot { background: var(--err-fg); }
  .sn-status.mute { color: var(--ink-mute); } .sn-status.mute .sn-dot { background: var(--ink-mute); }
  .sn-pay { margin-top: 3px; font-size: 11.5px; font-weight: 500; color: var(--warn-fg); font-variant-numeric: tabular-nums; }
  /* 動作鈕（沿用 .cancel-btn）：右欄垂直置中、實心紅、俐落直角 */
  .sn-row .cancel-btn { align-self: center; white-space: nowrap; border: 0; border-radius: 0; background: var(--err-fg); color: #fff; font-weight: 700; font-size: 12.5px; letter-spacing: .06em; min-height: 32px; padding: 0 14px; line-height: 32px; cursor: pointer; }
  .sn-row.is-past { opacity: .55; }
  .sn-row.is-past .sn-kind { color: var(--ink-mute); border-color: var(--line); background: transparent; }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 4px 0 10px;
  }
  /* Lookup form */
  .lookup-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
  }
  .lookup-field label {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }
  .lookup-field input {
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 16px; /* prevent iOS zoom */
    width: 100%;
    outline: none;
    transition: border-color .15s;
  }
  .lookup-field input:focus {
    border-color: var(--brand-500, #6366f1);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
  }
  .remaining-banner {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #1d4ed8;
    margin-bottom: 18px;
  }
</style>
</head>
<body>
<nav class="navbar sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/" class="brand-mark">
        <span class="brand-dot"><img src="/logo.png" alt="logo"></span> CHINUP Performance
      </a>
      <div class="hidden md:flex items-center gap-6">
        <a href="/" class="nav-link">課程</a>
        <a href="/coaches.html" class="nav-link">一對一預約</a>
        <a href="/my-schedule" class="nav-link active">我的課表</a>
        <a href="/admin.html" class="nav-link admin-only hidden">管理後台</a>
        <a href="/coach.html" class="nav-link coach-only hidden">教練後台</a>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="auth-bar" class="flex items-center gap-3"></div>
      <button id="nav-toggle" class="md:hidden nav-toggle-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
  </div>
  <div id="nav-mobile" class="hidden md:hidden">
    <div class="max-w-6xl mx-auto px-6 py-2 flex flex-col">
      <a href="/" class="nav-link-mobile">課程</a>
      <a href="/coaches.html" class="nav-link-mobile">一對一預約</a>
      <a href="/my-schedule" class="nav-link-mobile active">我的課表</a>
      <a href="/admin.html" class="nav-link-mobile admin-only hidden">管理後台</a>
      <a href="/coach.html" class="nav-link-mobile coach-only hidden">教練後台</a>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-6">
  <section class="hero">
    <span class="hero-eyebrow">📋 Personal</span>
    <h1>我的課表</h1>
    <p>輸入電話與姓名查詢預約記錄與剩餘堂數。</p>
  </section>

  <!-- ── Lookup form ── -->
  <section id="lookup-section" class="pb-8">
    <div class="card max-w-sm mx-auto" style="padding:24px;">
      <div class="lookup-field">
        <label for="lookup-phone">電話</label>
        <input
          id="lookup-phone"
          type="tel"
          inputmode="numeric"
          placeholder="09xxxxxxxx"
          autocomplete="tel"
          maxlength="20"
        >
      </div>
      <div class="lookup-field">
        <label for="lookup-name">姓名</label>
        <input
          id="lookup-name"
          type="text"
          placeholder="請輸入姓名"
          autocomplete="name"
          maxlength="50"
        >
      </div>
      <div
        id="lookup-error"
        class="text-sm text-red-600 mb-3"
        style="display:none;"
        role="alert"
      ></div>
      <button id="lookup-btn" class="btn btn-primary w-full">查詢</button>
    </div>
  </section>

  <!-- ── Results ── -->
  <section id="results-section" class="pb-16" style="display:none;">
    <!-- Remaining counts banner -->
    <div id="remaining-summary" class="remaining-banner">
      1對1 剩 0 堂 · 團體 剩 0 堂
    </div>

    <!-- Tabs -->
    <div class="tab-bar" id="tab-bar">
      <div class="tab-btn active" data-filter="all">全部</div>
      <div class="tab-btn" data-filter="booking">一對一</div>
      <div class="tab-btn" data-filter="registration">團課</div>
    </div>

    <!-- Upcoming -->
    <div id="upcoming-section">
      <div class="section-label">📅 即將到來</div>
      <div id="upcoming-list" class="sn-list"></div>
      <div id="upcoming-empty" class="empty-state" style="display:none;">
        <span class="empty-state-icon">📭</span>
        <p id="upcoming-empty-msg">尚無預約</p>
        <div class="flex gap-2 justify-center mt-3 flex-wrap">
          <a href="/" class="btn btn-ghost">瀏覽課程</a>
          <a href="/coaches.html" class="btn btn-primary">預約一對一</a>
        </div>
      </div>
    </div>

    <!-- Past (collapsible) -->
    <div id="past-toggle-wrap" style="display:none;">
      <div class="past-toggle" id="past-toggle">
        <span id="past-caret">▶</span>
        <span>過去記錄（<span id="past-count">0</span>）</span>
      </div>
      <div id="past-list" class="past-list sn-list" style="display:none;"></div>
    </div>

    <!-- Change account -->
    <div class="mt-8 text-center">
      <button id="change-lookup-btn" class="btn btn-ghost btn-sm">換電話 / 重新查詢</button>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="/app.js"></script>
<script type="module" src="/my-schedule.js"></script>
</body>
</html>
